[package]
name = "ak-factorio-rpg"
version = "0.1.0"
authors = ["semtexzv"]
description = "A live Memo RPG server built on Factorio-style mechanics using the ak actor framework"
edition = "2018"

[[bin]]
name = "factorio-rpg-server"
path = "src/main.rs"

[dependencies]
ak = { path = ".." }

[dependencies.futures]
package = "futures-preview"
version = "0.3.0-alpha.19"
features = ["async-await"]

[dependencies.tokio]
version = "=0.2.0-alpha.6"

[dependencies.tokio-net]
version = "=0.2.0-alpha.6"

[dependencies.tokio-io]
version = "=0.2.0-alpha.6"

[dependencies.tokio-timer]
version = "=0.3.0-alpha.6"
